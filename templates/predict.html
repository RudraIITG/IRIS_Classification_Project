<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Species Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #6a11cb, #2575fc);
        }

        .card {
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        label {
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #fff;
        }

        input[type="number"] {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            font-size: 1em;
        }

        input[type="submit"] {
            background: #ffde59;
            color: #1a1a1a;
            font-weight: bold;
            font-size: 1.2em;
            padding: 15px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            input[type="submit"] { padding: 12px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="card">
  <h1>Enter Iris Details</h1>

  <form action="/predict" method="POST">
    <label>Sepal Length:</label>
    <input type="number" step="0.1" name="sepal_length" required>

    <label>Sepal Width:</label>
    <input type="number" step="0.1" name="sepal_width" required>

    <label>Petal Length:</label>
    <input type="number" step="0.1" name="petal_length" required>

    <label>Petal Width:</label>
    <input type="number" step="0.1" name="petal_width" required>

    <div class="btn-row">
      <button type="submit" name="action" value="Random Forest">Random Forest</button>
      <button type="submit"  name="action" value = "Logistic Regression">Logistic Regression</button>
      <button type="submit"  name="action" value="K Nearest Neighbours">K Nearest Neighbours</button>

      <a href="/" class="btn">Home</a>
    </div>
  </form>
</div>

</body>
</html>
