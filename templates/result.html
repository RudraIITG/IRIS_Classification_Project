<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - Iris Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        p {
            font-size: 1.3em;
            margin-bottom: 30px;
        }

        .btn {
            background: #ffde59;
            color: #1a1a1a;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            p { font-size: 1.1em; }
            .btn { padding: 12px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Prediction Result</h1>
    <p>The predicted species is: <strong>{{ prediction }}</strong></p>
    <img
    src="{{ url_for('static', filename=prediction ~ '.jpeg') }}"
    alt="{{ prediction }}"
    style="width: 260px; max-width: 100%; border-radius: 16px; margin: 10px 0 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.35);"
    />

    <h1>Probabilities</h1>
    <p>Setosa : <strong>{{ setosa }}</strong></p>
    <p>versicolor : <strong>{{ versicolor }}</strong></p>
    <p>virginica : <strong>{{ virginica }}</strong></p>
    <a href="/predict" class="btn">Predict Another</a>
</div>

</body>
</html>
